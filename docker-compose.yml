services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - API_URL=http://api:8000
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [ui, api]
    restart: unless-stopped

volumes:
  caddy_data:
